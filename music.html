<body>

  <main class="music-page" id="musicPage" aria-label="Music page">
    <div class="music-browser">
      <div class="music-crumbs" id="musicCrumbs"></div>
      <table class="music-table">
        <thead id="musicHead"></thead>
        <tbody id="musicBody"></tbody>
      </table>
    </div>
  </main>
  <footer class="site-footer">
    <p>slush.tech v1.0 - Designed by Slush</p>

  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="player.js"></script>
  <script>
    const { FOLDERS, play } = window.SlushPlayer;
    const $ = (id) => document.getElementById(id);
    const page = $("musicPage");
    let viewGroup = null;
    let viewFolder = null;
    let viewKey = null;

    function cell(text, cls) {
      const td = document.createElement("td");
      td.textContent = text;
      if (cls) td.className = cls;
      return td;
    }

    function headRow(labels) {
      const tr = document.createElement("tr");
      labels.forEach(([text, cls]) => {
        const th = document.createElement("th");
        th.textContent = text;
        if (cls) th.className = cls;
        tr.append(th);
      });
      return tr;
    }

    function addRow(cells, onActivate, playing) {
      const tr = document.createElement("tr");
      tr.className = "music-row" + (playing ? " is-playing" : "");
      tr.tabIndex = 0;
      tr.setAttribute("role", "button");
      cells.forEach((c) => tr.append(cell(...c)));
      tr.addEventListener("click", onActivate);
      tr.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onActivate(); }
      });
      $("musicBody").append(tr);
      return tr;
    }

    function isCurrent(folder, index) {
      const c = window.SlushPlayer.current();
      return !!c && c.folder === folder && c.index === index;
    }

    function setCrumbs(parts) {
      const crumbs = $("musicCrumbs");
      crumbs.replaceChildren();
      parts.forEach((p, i) => {
        if (i) crumbs.append(document.createTextNode(" / "));
        if (p.go) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = p.label;
          b.addEventListener("click", p.go);
          crumbs.append(b);
        } else {
          crumbs.append(document.createTextNode(p.label));
        }
      });
    }

    const goTop = () => { viewGroup = null; viewKey = null; renderBrowser(); page.scrollTop = 0; };
    const goGroup = (name) => { viewGroup = name; viewKey = null; renderBrowser(); page.scrollTop = 0; };
    const goFolder = (i) => { viewKey = window.SlushPlayer.folderKey(FOLDERS[i]); viewGroup = FOLDERS[i].group || null; renderBrowser(); page.scrollTop = 0; };

    // Folders that share a `group` appear as one entry that opens a list of its sub-folders.
    function folderEntries() {
      if (viewGroup !== null) {
        return FOLDERS.map((f, i) => ({ f, i })).filter(({ f }) => f.group === viewGroup)
          .map(({ f, i }) => ({ name: f.name, count: f.tracks.length, open: () => goFolder(i) }));
      }
      const seen = new Set();
      const out = [];
      FOLDERS.forEach((f, i) => {
        if (!f.group) { out.push({ name: f.name, count: f.tracks.length, open: () => goFolder(i) }); return; }
        if (seen.has(f.group)) return;
        seen.add(f.group);
        const count = FOLDERS.filter((x) => x.group === f.group).reduce((n, x) => n + x.tracks.length, 0);
        out.push({ name: f.group, count, open: () => goGroup(f.group) });
      });
      return out;
    }

    function renderBrowser() {
      // Folders can appear or disappear when the library refreshes, so re-find the open one by name.
      viewFolder = viewKey === null ? null : FOLDERS.findIndex((f) => window.SlushPlayer.folderKey(f) === viewKey);
      if (viewFolder === -1) { viewFolder = null; viewKey = null; }
      if (viewGroup !== null && !FOLDERS.some((f) => f.group === viewGroup)) viewGroup = null;

      const head = $("musicHead");
      const body = $("musicBody");
      head.replaceChildren();
      body.replaceChildren();

      if (viewFolder === null) {
        setCrumbs(viewGroup === null ? [{ label: "Music" }] : [{ label: "Music", go: goTop }, { label: viewGroup }]);
        head.append(headRow([["#", "col-num"], ["Folder"], ["Tracks", "col-extra"]]));
        folderEntries().forEach((e, n) => addRow([[String(n + 1), "col-num"], [e.name], [String(e.count), "col-extra"]], e.open));
        return;
      }

      const folder = FOLDERS[viewFolder];
      const crumbs = [{ label: "Music", go: goTop }];
      if (folder.group) crumbs.push({ label: folder.group, go: () => goGroup(folder.group) });
      crumbs.push({ label: folder.name });
      setCrumbs(crumbs);

      if (folder.detail) {
        head.append(headRow([["#", "col-num"], ["Title"], ["Artist", "col-extra"], ["Album", "col-extra"], ["Year", "col-extra"]]));
      } else {
        head.append(headRow([["#", "col-num"], ["Title"], [folder.showArtist ? "Artist" : "Album", "col-extra"]]));
      }

      folder.tracks.forEach((t, i) => {
        const num = [String(i + 1), "col-num"];
        const activate = () => play(viewFolder, i);
        const playing = isCurrent(viewFolder, i);
        if (!folder.detail) {
          if (!folder.showArtist || t.artist) {
            addRow([num, [t.title], [folder.showArtist ? t.artist : folder.name, "col-extra"]], activate, playing);
            return;
          }
          // Artist missing from the curated data: fall back to the file's ID3 tag.
          const row = addRow([num, [t.title], ["...", "col-extra"]], activate, playing);
          window.SlushPlayer.meta(viewFolder, i).then((m) => { if (row.isConnected) row.cells[2].textContent = m.artist || "-"; });
          return;
        }
        // Artist/album/year come from each file's ID3 tags, so fill them in as they load.
        const tr = addRow([num, [t.title], ["...", "col-extra"], ["...", "col-extra"], ["...", "col-extra"]], activate, playing);
        window.SlushPlayer.meta(viewFolder, i).then((m) => {
          if (!tr.isConnected) return;
          tr.cells[1].textContent = m.title;
          tr.cells[2].textContent = m.artist || "-";
          tr.cells[3].textContent = m.album || "-";
          tr.cells[4].textContent = m.year || "-";
        });
      });
    }

    const offChange = window.SlushPlayer.onChange(renderBrowser);
    const offLibrary = window.SlushPlayer.onLibrary(renderBrowser);
    window.addEventListener("slush:pageleave", () => { offChange(); offLibrary(); }, { once: true });
    renderBrowser();

    // Equalizer panel: lives directly above the player and only exists on this page.
    (() => {
      const SP = window.SlushPlayer;
      const EQ_KEY = "slush-eq-open";
      const eq = document.createElement("section");
      eq.className = "music-player music-eq";
      eq.setAttribute("aria-label", "Equalizer");
      eq.innerHTML = `
        <button class="player-toggle" type="button" aria-expanded="false">
          <span class="player-label">Equalizer</span>
          <span class="player-mini">Equalizer</span>
          <span class="player-chevron" aria-hidden="true">&#9650;</span>
        </button>
        <div class="eq-body" hidden><canvas class="eq-canvas" role="img" aria-label="Live audio spectrum"></canvas></div>`;
      SP.element.before(eq);
      document.body.classList.add("has-eq");

      const toggle = eq.querySelector(".player-toggle");
      const body = eq.querySelector(".eq-body");
      const canvas = eq.querySelector("canvas");
      const g = canvas.getContext("2d");
      let open = false;
      let raf = 0;
      let dpr = 1;
      let layout = null;
      let peaks = [];
      let data = null;

      function computeLayout(w, h) {
        const seg = Math.max(3, Math.round(5 * dpr));
        const gap = Math.max(1, Math.round(2 * dpr));
        const barW = Math.round(16 * dpr);
        const barGap = Math.round(4 * dpr);
        const n = Math.max(8, Math.min(48, Math.floor((w + barGap) / (barW + barGap))));
        const rows = Math.max(4, Math.floor((h * 0.78 + gap) / (seg + gap)));
        const baseY = rows * (seg + gap) - gap;
        return {
          seg, gap, barW, barGap, n, rows, baseY,
          x0: Math.round((w - (n * barW + (n - 1) * barGap)) / 2),
          reflRows: Math.max(0, Math.floor((h - baseY - gap) / (seg + gap)))
        };
      }

      function resize() {
        dpr = window.devicePixelRatio || 1;
        const w = Math.round(canvas.clientWidth * dpr);
        const h = Math.round(canvas.clientHeight * dpr);
        if (!w || !h) return;
        canvas.width = w;
        canvas.height = h;
        layout = computeLayout(w, h);
        peaks = new Array(layout.n).fill(0);
      }

      // Bars are log-spaced from 40 Hz to 16 kHz and take the loudest FFT bin in their band.
      function levelsFrom(analyser, n) {
        const out = new Array(n).fill(0);
        if (!data || data.length !== analyser.frequencyBinCount) data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        const rate = analyser.context.sampleRate;
        const binHz = rate / analyser.fftSize;
        const fmin = 40;
        const fmax = Math.min(16000, rate / 2);
        for (let i = 0; i < n; i++) {
          const lo = fmin * Math.pow(fmax / fmin, i / n);
          const hi = fmin * Math.pow(fmax / fmin, (i + 1) / n);
          const a = Math.max(1, Math.floor(lo / binHz));
          const b = Math.max(a + 1, Math.ceil(hi / binHz));
          let m = 0;
          for (let k = a; k < b && k < data.length; k++) if (data[k] > m) m = data[k];
          out[i] = Math.min(1, (m / 255) * (1 + 0.5 * (i / n)));
        }
        return out;
      }

      function frame() {
        raf = requestAnimationFrame(frame);
        if (!layout) return;
        const L = layout;
        const analyser = SP.analyser();
        const levels = analyser ? levelsFrom(analyser, L.n) : new Array(L.n).fill(0);
        const hue = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rgb-hue")) || 0;
        const step = L.seg + L.gap;

        g.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < L.n; i++) {
          peaks[i] = Math.max(levels[i], peaks[i] - 0.015);
          const x = L.x0 + i * (L.barW + L.barGap);
          const lit = Math.round(levels[i] * L.rows);
          const peak = Math.min(L.rows - 1, Math.round(peaks[i] * L.rows) - 1);
          const litColor = (r) => `hsl(${hue}, 100%, ${50 + 42 * Math.pow(r / L.rows, 1.6)}%)`;

          for (let r = 0; r < L.rows; r++) {
            if (r < lit) g.fillStyle = litColor(r);
            else if (r === peak) g.fillStyle = `hsl(${hue}, 100%, 92%)`;
            else if (r < peak) g.fillStyle = `hsla(${hue}, 100%, 50%, 0.2)`;
            else g.fillStyle = `hsla(${hue}, 100%, 50%, 0.07)`;
            g.fillRect(x, (L.rows - 1 - r) * step, L.barW, L.seg);
          }

          for (let r = 0; r < Math.min(lit, L.reflRows); r++) {
            g.globalAlpha = 0.3 * (1 - r / L.reflRows);
            g.fillStyle = litColor(r);
            g.fillRect(x, L.baseY + L.gap + r * step, L.barW, L.seg);
          }
          g.globalAlpha = 1;
        }

        if (SP.graphBlocked()) {
          g.fillStyle = `hsl(${hue}, 100%, 50%)`;
          g.font = `${Math.round(12 * dpr)}px "DM Mono", monospace`;
          g.textAlign = "center";
          g.fillText("EQUALIZER UNAVAILABLE", canvas.width / 2, canvas.height / 2);
        }
      }

      function start() {
        if (!raf && open && !document.hidden) raf = requestAnimationFrame(frame);
      }

      function stopLoop() {
        cancelAnimationFrame(raf);
        raf = 0;
      }

      function setOpen(on) {
        open = on;
        eq.classList.toggle("is-expanded", on);
        body.hidden = !on;
        toggle.setAttribute("aria-expanded", String(on));
        try { sessionStorage.setItem(EQ_KEY, on ? "1" : "0"); } catch (e) { /* storage unavailable */ }
        if (on) { resize(); start(); } else { stopLoop(); }
      }

      const onVisibility = () => { if (document.hidden) stopLoop(); else start(); };
      toggle.addEventListener("click", () => setOpen(!open));
      document.addEventListener("visibilitychange", onVisibility);

      const sizeObserver = new ResizeObserver(() => { if (open) resize(); });
      sizeObserver.observe(canvas);

      // Match the player's expanded height so the two panels stay the same size.
      const playerBody = SP.element.querySelector("#playerBody");
      const heightObserver = new ResizeObserver(() => {
        const h = playerBody.offsetHeight;
        if (h) body.style.height = `${h}px`;
      });
      heightObserver.observe(playerBody);

      let startOpen = false;
      try { startOpen = sessionStorage.getItem(EQ_KEY) === "1"; } catch (e) { /* storage unavailable */ }
      setOpen(startOpen);

      window.addEventListener("slush:pageleave", () => {
        stopLoop();
        sizeObserver.disconnect();
        heightObserver.disconnect();
        document.removeEventListener("visibilitychange", onVisibility);
        eq.remove();
        document.body.classList.remove("has-eq");
      }, { once: true });
    })();
  </script>
</body>
