  <main class="gallery-page" aria-label="Gallery page">
    <p class="gallery-status" id="galleryStatus" aria-live="polite">Loading...</p>
    <div class="gallery-grid" id="galleryGrid"></div>
    <section class="gallery-viewer" aria-label="Image viewer">
      <button class="theme-toggle gallery-back" id="galleryBack" type="button"><svg class="back-arrow" viewBox="0 0 16 10" aria-hidden="true"><path d="M15 5H2M5.5 1.5 2 5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Back to gallery</button>
      <div class="photo-carousel">
        <button class="carousel-button" id="galleryPrev" type="button" aria-label="Previous image" title="Previous image">
          <span aria-hidden="true">&#8249;</span>
        </button>
        <div class="carousel-stage" id="galleryStage">
          <img class="gallery-viewer-image" id="galleryViewerImage" alt="">
        </div>
        <button class="carousel-button" id="galleryNext" type="button" aria-label="Next image" title="Next image">
          <span aria-hidden="true">&#8250;</span>
        </button>
      </div>
    </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="photos.js"></script>
  <script>
    const REFRESH_INTERVAL = 60000;
    const grid = document.getElementById("galleryGrid");
    const statusEl = document.getElementById("galleryStatus");
    const page = document.querySelector(".gallery-page");
    const viewerImage = document.getElementById("galleryViewerImage");
    const tiles = new Map();
    let refreshing = false;
    let currentTile = null;
    let savedScroll = 0;

    function showTile(tile) {
      currentTile = tile;
      viewerImage.classList.remove("is-loaded");
      viewerImage.src = tile.dataset.url;
      const all = [...grid.children];
      const index = all.indexOf(tile);
      [all[(index + 1) % all.length], all[(index - 1 + all.length) % all.length]].forEach((neighbor) => {
        new Image().src = neighbor.dataset.url;
      });
    }

    function openViewer(tile) {
      savedScroll = page.scrollTop;
      page.classList.add("is-viewing");
      showTile(tile);
      document.getElementById("galleryBack").focus();
    }

    function closeViewer() {
      const tile = currentTile;
      currentTile = null;
      page.classList.remove("is-viewing");
      viewerImage.removeAttribute("src");
      page.scrollTop = savedScroll;
      if (tile && tile.isConnected) tile.focus({ preventScroll: true });
    }

    function step(delta) {
      const all = [...grid.children];
      if (!currentTile || all.length < 2) return;
      showTile(all[(all.indexOf(currentTile) + delta + all.length) % all.length]);
    }

    viewerImage.addEventListener("load", () => viewerImage.classList.add("is-loaded"));
    viewerImage.addEventListener("error", () => viewerImage.classList.add("is-loaded"));
    grid.addEventListener("click", (event) => {
      const tile = event.target.closest(".gallery-tile");
      if (tile) openViewer(tile);
    });
    document.getElementById("galleryBack").addEventListener("click", closeViewer);
    document.getElementById("galleryPrev").addEventListener("click", () => step(-1));
    document.getElementById("galleryNext").addEventListener("click", () => step(1));
    document.addEventListener("keydown", (event) => {
      if (!currentTile) return;
      if (event.key === "Escape") closeViewer();
      else if (event.key === "ArrowLeft") step(-1);
      else if (event.key === "ArrowRight") step(1);
    });

    let touchStartX = null;
    const stage = document.getElementById("galleryStage");
    stage.addEventListener("touchstart", (event) => { touchStartX = event.touches[0].clientX; }, { passive: true });
    stage.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(deltaX) > 50) step(deltaX < 0 ? 1 : -1);
    }, { passive: true });

    function createTile(url) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "gallery-tile";
      tile.dataset.url = url;
      tile.setAttribute("aria-label", "View image");
      const img = document.createElement("img");
      img.src = url;
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("load", () => tile.classList.add("is-loaded"));
      img.addEventListener("error", () => tile.classList.add("is-loaded"));
      tile.appendChild(img);
      return tile;
    }

    // Initial load keeps the shuffled order; later refreshes add new images at random spots and drop deleted ones.
    function sync(urls, initial) {
      const current = new Set(urls);
      let replacement = null;
      let removedCurrent = false;
      for (const [url, tile] of tiles) {
        if (!current.has(url)) {
          if (tile === currentTile) {
            removedCurrent = true;
            replacement = tile.nextElementSibling || tile.previousElementSibling;
          }
          tile.remove();
          tiles.delete(url);
        }
      }
      if (removedCurrent) {
        if (replacement && replacement.isConnected) showTile(replacement);
        else closeViewer();
      }
      for (const url of urls) {
        if (tiles.has(url)) continue;
        const tile = createTile(url);
        tiles.set(url, tile);
        const siblings = grid.children;
        const position = initial ? siblings.length : Math.floor(Math.random() * (siblings.length + 1));
        grid.insertBefore(tile, siblings[position] || null);
      }
      statusEl.hidden = false;
      statusEl.textContent = tiles.size ? `${tiles.size} ${tiles.size === 1 ? "image" : "images"} in gallery` : "No images found.";
    }

    async function refresh(initial) {
      if (refreshing) return;
      refreshing = true;
      try {
        sync(await window.listSpacesImages("Main and Gallery/"), initial);
      } catch (error) {
        console.error(error);
        if (initial) statusEl.textContent = "Unable to load images.";
      } finally {
        refreshing = false;
      }
    }

    refresh(true);
    setInterval(() => { if (!document.hidden) refresh(false); }, REFRESH_INTERVAL);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
  </script>
</body>
</html>
