  <script src="player.js"></script>
  <script>
    const coin = document.getElementById("coin");
    const coinButton = document.getElementById("coinButton");
    const resultText = document.getElementById("coinResult");
    const historyList = document.getElementById("coinHistory");
    const emptyText = document.getElementById("coinEmpty");
    const clearButton = document.getElementById("coinClear");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const FLIP_MS = reduceMotion ? 400 : 3200;

    // Session-only state; it resets whenever the page is loaded again.
    const flips = [];
    let rotation = 0;
    let flipping = false;

    function pct(count) {
      return flips.length ? (count / flips.length * 100).toFixed(1) + "%" : "0.0%";
    }

    function plural(count) {
      return count + (count === 1 ? " flip" : " flips");
    }

    function render() {
      const heads = flips.filter((f) => f === "Heads").length;
      const tails = flips.length - heads;
      document.getElementById("headsPct").textContent = pct(heads);
      document.getElementById("tailsPct").textContent = pct(tails);
      document.getElementById("headsCount").textContent = plural(heads);
      document.getElementById("tailsCount").textContent = plural(tails);
      emptyText.hidden = flips.length > 0;
      clearButton.disabled = flips.length === 0 || flipping;
    }

    function addResult(side) {
      flips.push(side);
      const item = document.createElement("li");
      item.textContent = side;
      historyList.prepend(item);
      historyList.start = flips.length;
      resultText.textContent = side;
      render();
    }

    function flip() {
      if (flipping) return;
      flipping = true;
      coinButton.disabled = true;
      clearButton.disabled = true;
      resultText.textContent = "Flipping...";

      const side = Math.random() < 0.5 ? "Heads" : "Tails";
      const spins = 5 + Math.floor(Math.random() * 4);
      // Land on a multiple of 360 (heads up) or 180 past it (tails up), always rotating forward.
      rotation = Math.floor(rotation / 360) * 360 + spins * 360 + (side === "Tails" ? 180 : 0);

      coin.style.transition = "transform " + FLIP_MS + "ms cubic-bezier(0.2, 0.7, 0.3, 1)";
      coin.style.transform = "rotateX(" + rotation + "deg)";

      setTimeout(() => {
        flipping = false;
        coinButton.disabled = false;
        addResult(side);
        coinButton.focus({ preventScroll: true });
      }, FLIP_MS + 50);
    }

    coinButton.addEventListener("click", flip);
    clearButton.addEventListener("click", () => {
      flips.length = 0;
      historyList.replaceChildren();
      resultText.innerHTML = "&nbsp;";
      render();
    });
    render();
  </script>
