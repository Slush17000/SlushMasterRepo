  <main class="photo-carousel" aria-label="Personal photo carousel">
    <button class="carousel-button" id="previousPhoto" type="button" aria-label="Previous image" title="Previous image">
      <span aria-hidden="true">&#8249;</span>
    </button>
    <div class="carousel-stage">
      <img class="carousel-image" id="carouselImage" alt="">
      <span class="photo-count" id="photoCount" aria-live="polite"></span>
    </div>
    <button class="carousel-button" id="nextPhoto" type="button" aria-label="Next image" title="Next image">
      <span aria-hidden="true">&#8250;</span>
    </button>
  </main>
  <footer class="site-footer">

  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="photos.js"></script>
  <script>
    const photos = [...(window.carouselPhotos || [])];
    const carouselImage = document.getElementById("carouselImage");
    const photoCount = document.getElementById("photoCount");
    const autoAdvanceDelay = 6000;
    const autoAdvanceEnabled = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let currentPhoto = 0;
    let loadRequest = 0;
    let autoAdvanceTimer = null;

    for (let index = photos.length - 1; index > 0; index -= 1) {
      const randomIndex = Math.floor(Math.random() * (index + 1));
      [photos[index], photos[randomIndex]] = [photos[randomIndex], photos[index]];
    }

    function displayPhoto(index, direction = 1) {
      if (photos.length === 0) {
        photoCount.textContent = "No local images found.";
        return;
      }

      currentPhoto = (index + photos.length) % photos.length;
      const requestId = ++loadRequest;
      const nextImage = new Image();
      nextImage.onload = () => {
        if (requestId !== loadRequest) {
          return;
        }

        let outgoingImage = null;
        if (carouselImage.classList.contains("is-loaded")) {
          outgoingImage = carouselImage.cloneNode();
          outgoingImage.removeAttribute("id");
          outgoingImage.alt = "";
          outgoingImage.setAttribute("aria-hidden", "true");
          outgoingImage.classList.add("carousel-image-outgoing");
          carouselImage.parentElement.insertBefore(outgoingImage, carouselImage);
        }

        carouselImage.src = nextImage.src;
        carouselImage.alt = `Personal photo ${currentPhoto + 1} of ${photos.length}`;
        carouselImage.classList.remove("is-loaded", "slide-from-left", "slide-from-right");
        carouselImage.classList.add(direction >= 0 ? "slide-from-right" : "slide-from-left");
        photoCount.textContent = `${String(currentPhoto + 1).padStart(2, "0")} / ${String(photos.length).padStart(2, "0")}`;

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            carouselImage.classList.add("is-loaded");
            if (outgoingImage) {
              outgoingImage.classList.add(direction >= 0 ? "slide-to-left" : "slide-to-right");
              window.setTimeout(() => outgoingImage.remove(), 460);
            }
          });
        });
      };
      nextImage.onerror = () => {
        photoCount.textContent = `Could not load image ${currentPhoto + 1} of ${photos.length}.`;
      };
      nextImage.src = photos[currentPhoto];
    }

    function resetAutoAdvance() {
      if (!autoAdvanceEnabled) {
        return;
      }
      if (autoAdvanceTimer !== null) {
        window.clearInterval(autoAdvanceTimer);
      }
      autoAdvanceTimer = window.setInterval(() => displayPhoto(currentPhoto + 1, 1), autoAdvanceDelay);
    }

    document.getElementById("previousPhoto").addEventListener("click", () => {
      displayPhoto(currentPhoto - 1, -1);
      resetAutoAdvance();
    });
    document.getElementById("nextPhoto").addEventListener("click", () => {
      displayPhoto(currentPhoto + 1, 1);
      resetAutoAdvance();
    });

    displayPhoto(0, 1);
    resetAutoAdvance();
  </script>
</body>
</html>
